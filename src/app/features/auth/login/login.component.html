<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-12">
  <div class="w-full max-w-sm">
    <div class="mb-8 flex flex-col items-center text-center">
      <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-brand-600 text-lg font-bold text-white">R</span>
      <h1 class="mt-4 text-xl font-semibold text-slate-900">ReviewHood for Business</h1>
      <p class="mt-1 text-sm text-slate-500">Manage your products and answer your customers</p>
    </div>

    <form class="card space-y-4 p-6" (ngSubmit)="onSubmit()">
      @if (error()) {
        <div class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700" role="alert">{{ error() }}</div>
      }

      <div>
        <label class="label" for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" class="input" [(ngModel)]="email" required autofocus />
      </div>

      <div>
        <label class="label" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" class="input" [(ngModel)]="password" required />
      </div>

      <button type="submit" class="btn-primary w-full" [disabled]="loading()">
        @if (loading()) {
          <lucide-icon [img]="LoaderCircle" [size]="16" class="animate-spin" />
        }
        Sign in
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-slate-500">
      Use your ReviewHood account. To get access, your company head invites you from the Team page,
      or the ReviewHood team adds you to your company.
    </p>
  </div>
</div>
