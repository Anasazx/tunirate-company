<div class="min-h-screen bg-gray-50 flex items-center justify-center">
  <div class="container mx-auto p-4">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden lg:flex">

      <!-- Left Panel: Branding -->
      <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-blue-600 to-purple-600 p-12 flex-col justify-between">
        <div>
          <h1 class="text-white text-4xl font-extrabold">TuniRate</h1>
          <p class="text-white text-opacity-80 mt-4">
            Real reviews from real people. Your trusted guide to making better choices.
          </p>
        </div>
        <div class="text-white text-opacity-60 text-sm">
          © 2026 TuniRate. All rights reserved.
        </div>
      </div>

      <!-- Right Panel: Login Form -->
      <div class="w-full lg:w-1/2 p-8 lg:p-12">
        <a routerLink="/" class="mb-4 inline-flex items-center text-sm font-medium text-blue-600 hover:underline">← Back to Home</a>
        <h2 class="text-3xl font-bold text-gray-900 mb-4">Welcome Back!</h2>
        <p class="text-gray-600 mb-8">Sign in to continue to your account.</p>

        <form (submit)="onSubmit(email.value, password.value, $event)">
          <!-- Email Input -->
          <div class="mb-6">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
            <input #email type="email" id="email" name="email"
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                   placeholder="you@example.com" required>
          </div>

          <!-- Password Input -->
          <div class="mb-6">
            <div class="flex justify-between items-baseline">
              <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
              <a href="#" class="text-sm text-blue-600 hover:underline">Forgot password?</a>
            </div>
            <input #password type="password" id="password" name="password"
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                   placeholder="••••••••" required>
          </div>

          <!-- Login Button -->
          <div>
            <button type="submit" [disabled]="loading"
                    class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-all duration-300 transform hover:scale-105 disabled:opacity-60">
              <span *ngIf="!loading">Sign In</span>
              <span *ngIf="loading">Signing in…</span>
            </button>
          </div>
        </form>

        <div *ngIf="error" class="mt-4 rounded-md bg-red-50 p-3 text-sm text-red-700">{{ error }}</div>

        <!-- Social Logins -->
        <div class="mt-8">
          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-2 bg-white text-gray-500">Or continue with</span>
            </div>
          </div>

          <div class="mt-6 grid grid-cols-2 gap-4">
            <div>
              <a href="#"
                 class="w-full inline-flex justify-center py-3 px-4 border border-gray-300 rounded-xl shadow-sm bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 transition-all">
                <img class="w-5 h-5" src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                <span class="ml-2">Google</span>
              </a>
            </div>
            <div>
              <a href="#"
                 class="w-full inline-flex justify-center py-3 px-4 border border-gray-300 rounded-xl shadow-sm bg-white text-sm font-medium text-gray-500 hover:bg-gray-50 transition-all">
                <img class="w-5 h-5" src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook">
                <span class="ml-2">Facebook</span>
              </a>
            </div>
          </div>
        </div>

        <!-- Sign Up Link -->
        <div class="mt-8 text-center">
          <p class="text-sm text-gray-600">
            Don't have an account? <a routerLink="/register" class="font-medium text-blue-600 hover:underline">Sign up</a>
          </p>
        </div>
      </div>

    </div>
  </div>
</div>
