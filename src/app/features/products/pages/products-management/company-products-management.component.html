<div class="space-y-6">

  <!-- HEADER -->
  <div class="flex items-center justify-between">

    <div>
      <h1 class="text-3xl font-bold">Products</h1>
      <p class="text-slate-500">Manage your company products</p>
    </div>

    <button
      (click)="addProduct()"
      class="rounded-xl bg-sky-600 px-5 py-2 text-white font-medium hover:bg-sky-700"
    >
      + Add Product
    </button>

  </div>

  <!-- TABLE -->
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">

    <table class="w-full text-sm">

      <thead class="bg-slate-50 text-slate-600">
        <tr>
          <th class="text-left p-4">Product</th>
          <th class="text-left p-4">Category</th>
          <th class="text-left p-4">Status</th>
          <th class="text-left p-4">Created</th>
          <th class="text-right p-4">Actions</th>
        </tr>
      </thead>

      <tbody>

        <tr
          *ngFor="let p of products"
          class="border-t hover:bg-slate-50 transition cursor-pointer"
          (click)="productDetails( p.id)"
        >

          <!-- PRODUCT -->
          <td class="p-4 font-medium flex items-center gap-3">

            <img
              *ngIf="p.imageUrl"
              [src]="sharedService.getImageUrl(p.imageUrl)"
              alt="Product Image"
              class="w-10 h-10 rounded-lg object-cover border"
            />

            <span>
              {{ p.name }}
            </span>

          </td>

          <!-- CATEGORY -->
          <td class="p-4 text-slate-600">
            {{ p.categoryName || "-" }}
          </td>

          <!-- STATUS -->
          <td class="p-4">

            <span
              class="inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold"
              [ngClass]="{
                'bg-gray-100 text-gray-700': p.status === 'DRAFT',
                'bg-amber-100 text-amber-700': p.status === 'PENDING_REVIEW',
                'bg-green-100 text-green-700': p.status === 'PUBLISHED',
                'bg-red-100 text-red-700': p.status === 'REJECTED',
                'bg-slate-200 text-slate-700': p.status === 'ARCHIVED'
              }">

              {{ p.status || '-' }}

            </span>

          </td>



          <!-- CREATED -->
          <td class="p-4 text-slate-500">
            {{ p.createdAt | date:'mediumDate' }}
          </td>

          <!-- ACTIONS -->
          <td class="p-4 text-right">

            <button
              (click)="editProduct(p.id)"
              class="text-sky-600 hover:underline font-medium"
            >
              Edit
            </button>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>
