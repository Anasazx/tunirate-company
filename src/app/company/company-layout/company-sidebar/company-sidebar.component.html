<aside class="fixed top-16 left-0 bottom-0 w-64 bg-gray-900 text-white flex flex-col border-r border-gray-800 overflow-y-auto">

  <!-- LOGO -->

<div class="px-6 py-7 border-b border-gray-800">
  <div class="flex items-center gap-3">

    <img
      *ngIf="company"
      [src]="sharedService.getImageUrl(company.logoUrl)"
      [alt]="company.name"
      class="w-11 h-11 rounded-full object-cover shrink-0"
    />

    <div class="min-w-0">
      <p class="font-semibold text-lg text-white truncate">
        {{ company.name }}
      </p>
      <p class="text-xs text-gray-400">
        Company Panel
      </p>
    </div>

  </div>
</div>



  <!-- NAV -->
  <nav class="flex-1 px-3 py-6">

    <p class="text-xs font-semibold text-gray-500 uppercase px-3 mb-3">
      Navigation
    </p>

    <ul class="space-y-1">

      <li
        *ngFor="let item of menuItems"
        [ngClass]="{ 'hidden': item.headOnly && !isHead() }"
      >

        <a
          [routerLink]="item.path"
          routerLinkActive="bg-gray-800 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition group"
        >

          <!-- ICON -->
          <span class="w-5 h-5 text-gray-400 group-hover:text-white">

            <ng-container [ngSwitch]="item.icon">

              <!-- Dashboard -->
              <svg *ngSwitchCase="'dashboard'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-18v6h8V3h-8z"/>
              </svg>

              <!-- Message -->
              <svg *ngSwitchCase="'message'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4-.8L3 20l1.8-3.6A7.963 7.963 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
              </svg>

              <!-- Grid -->
              <svg *ngSwitchCase="'grid'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h7"/>
              </svg>

              <!-- Users -->
              <svg *ngSwitchCase="'users'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87M16 3.13a4 4 0 010 7.75M8 3.13a4 4 0 000 7.75"/>
              </svg>

              <!-- Settings -->
              <svg *ngSwitchCase="'settings'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8a4 4 0 100 8 4 4 0 000-8z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 12h-2M5 12H3m15.364 6.364l-1.414-1.414M7.05 7.05L5.636 5.636m12.728 0l-1.414 1.414M7.05 16.95l-1.414 1.414"/>
              </svg>

              <!-- Dashboard fallback -->
              <svg *ngSwitchDefault class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 13h8V3H3v10z"/>
              </svg>

            </ng-container>

          </span>

          <!-- LABEL -->
          <span class="font-medium text-sm">
            {{ item.label }}
          </span>

        </a>

      </li>

    </ul>

  </nav>

  <!-- FOOTER -->
  <div class="px-6 py-4 border-t border-gray-800 text-center">
    <p class="text-xs text-gray-500">© 2026 TuniRate</p>
  </div>

</aside>
