<div class="p-6">

  <!-- header -->
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-bold">Companies</h2>

    <button
      (click)="openCreateModal()"
      class="bg-blue-600 text-white px-3 py-1 rounded">
      New Company
    </button>
  </div>




  <!-- search bar -->
<div class="mb-4">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    (input)="filterCompanies()"
    placeholder="Search companies..."
    class="w-full md:w-80 border px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
  />
</div>




  <!-- loading / error -->
  <div *ngIf="loading" class="p-4 bg-white rounded border">
    Loading...
  </div>

  <div *ngIf="error" class="p-4 bg-red-50 text-red-700 rounded border">
    {{ error }}
  </div>

  

  <!-- table -->
  <div class="bg-white border rounded">
    <table class="w-full text-left">

      <thead class="bg-gray-50">
        <tr>
          <th class="p-3">Name</th>
          <th class="p-3">Verified</th>
          <th class="p-3">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let c of filteredCompanies" class="border-t">

          <td class="p-3">{{ c.name }}</td>

          <td class="p-3">
            {{ c.verified ? 'Yes' : 'No' }}
          </td>

          <td class="p-3 flex gap-3">

            <a [routerLink]="['/admin/companies', c.id]"
               class="text-blue-600">
              Edit
            </a>

            <button
              (click)="delete(c.id)"
              class="text-red-600">
              Delete
            </button>

          </td>

        </tr>
      </tbody>

    </table>
  </div>

</div>



<div *ngIf="showModal" class="fixed inset-0 bg-black/50 flex items-center justify-center">

  <div class="bg-white w-full max-w-md p-6 rounded-lg shadow-lg">

    <h3 class="text-xl font-bold mb-4">
      {{ editId ? 'Edit Company' : 'Create Company' }}
    </h3>

    <div class="space-y-3">

      <input
        [(ngModel)]="form.name"
        placeholder="Name"
        class="w-full border px-3 py-2 rounded" />

      <textarea
        [(ngModel)]="form.description"
        placeholder="Description"
        class="w-full border px-3 py-2 rounded">
      </textarea>

      <label class="flex items-center gap-2">
        <input type="checkbox" [(ngModel)]="form.verified" />
        Verified
      </label>

    </div>

    <div class="flex justify-end gap-2 mt-4">

      <button
        (click)="closeModal()"
        class="px-3 py-1 border rounded">
        Cancel
      </button>

      <button
        (click)="save()"
        class="bg-green-600 text-white px-3 py-1 rounded">
        Save
      </button>

    </div>

  </div>

</div>
