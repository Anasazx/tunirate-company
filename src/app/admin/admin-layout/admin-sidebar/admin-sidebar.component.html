<aside class="fixed top-16 left-0 bottom-0 w-64 bg-gray-900 text-white flex flex-col border-r border-gray-800 overflow-y-auto">

  <!-- LOGO -->
  <div class="px-6 py-7 border-b border-gray-800">
    <div class="flex items-center gap-3">

      <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center font-bold">
        TR
      </div>

      <div>
        <p class="font-bold text-lg leading-tight">TuniRate</p>
        <p class="text-xs text-gray-400">Admin Panel</p>
      </div>

    </div>
  </div>

  <!-- NAV -->
  <nav class="flex-1 px-3 py-6">

    <p class="text-xs font-semibold text-gray-500 uppercase px-3 mb-3">
      Navigation
    </p>

    <ul class="space-y-1">

      <li *ngFor="let item of menuItems">

        <a
          [routerLink]="item.path"
          routerLinkActive="bg-gray-800 text-white"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition group">

          <!-- ICON -->
          <span class="w-5 h-5 text-gray-400 group-hover:text-white">

            <ng-container [ngSwitch]="item.icon">

              <!-- Dashboard -->
              <svg *ngSwitchCase="'dashboard'" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-18v6h8V3h-8z"/>
              </svg>

              <!-- Box -->
              <svg *ngSwitchCase="'box'" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10"/>
              </svg>

              <!-- Grid -->
              <svg *ngSwitchCase="'grid'" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h7"/>
              </svg>

              <!-- Building -->
              <svg *ngSwitchCase="'building'" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 21h18M9 8h6m-6 4h6M5 21V7a2 2 0 012-2h10a2 2 0 012 2v14"/>
              </svg>

              <!-- Users -->
              <svg *ngSwitchCase="'users'" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87M16 3.13a4 4 0 010 7.75M8 3.13a4 4 0 000 7.75"/>
              </svg>

            </ng-container>

          </span>

          <!-- LABEL -->
          <span class="font-medium text-sm">
            {{ item.label }}
          </span>

        </a>

      </li>

    </ul>

  </nav>

  <!-- FOOTER -->
  <div class="px-6 py-4 border-t border-gray-800 text-center">
    <p class="text-xs text-gray-500">© 2026 TuniRate</p>
  </div>

</aside>
